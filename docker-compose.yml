name: shopee-lite

services:
  # ---------------------------------------------------------------- infra ----
  postgres:
    image: postgres:16-alpine
    container_name: sl-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    # Official Apache image. (bitnami/kafka was pulled from Docker Hub in
    # Aug 2025 - anything you read online referencing it is now out of date.)
    # Env vars = broker properties with dots replaced by underscores:
    #   num.partitions -> KAFKA_NUM_PARTITIONS
    image: apache/kafka:3.9.2
    container_name: sl-kafka
    ports:
      # 9092 = inside the docker network (kafka:9092)
      # 29092 = from your laptop (localhost:29092)
      - "29092:29092"
    environment:
      # --- KRaft mode: no ZooKeeper needed ---
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
      # --- two listeners: one for containers, one for your laptop ---
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # --- single-broker safety valves (defaults of 3 would fail here) ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      # --- convenience for a demo; disable both in production ---
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "3"
    # No volume on purpose: Kafka data lives in the container, so `down`
    # gives you a clean slate. Postgres keeps its volume - that is the
    # source of truth. Events are transient by nature.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: sl-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

  # ------------------------------------------------------------- services ----
  user-service:
    build: ./services/user-service
    restart: on-failure
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: users_db
      KAFKA_BROKERS: kafka:9092
      # Signing key. user-service signs, api-gateway verifies - both must match.
      # Production: a managed secret, and ideally RS256 so only the signer holds
      # the private key.
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret}
      JWT_EXPIRES_IN: 1h
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  order-service:
    build: ./services/order-service
    restart: on-failure
    ports:
      - "3002:3002"
    environment:
      PORT: "3002"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: orders_db
      KAFKA_BROKERS: kafka:9092
      USER_SERVICE_URL: http://user-service:3001
      INVENTORY_SERVICE_URL: http://inventory-service:3003
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  inventory-service:
    build: ./services/inventory-service
    restart: on-failure
    ports:
      - "3003:3003"
    environment:
      PORT: "3003"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: inventory_db
      KAFKA_BROKERS: kafka:9092
      SEED_PRODUCTS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification-service:
    build: ./services/notification-service
    restart: on-failure
    ports:
      - "3004:3004"
    environment:
      PORT: "3004"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: notifications_db
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  api-gateway:
    build: ./services/api-gateway
    restart: on-failure
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      USER_SERVICE_URL: http://user-service:3001
      ORDER_SERVICE_URL: http://order-service:3002
      INVENTORY_SERVICE_URL: http://inventory-service:3003
      NOTIFICATION_SERVICE_URL: http://notification-service:3004
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret}
    depends_on:
      - user-service
      - order-service
      - inventory-service
      - notification-service

volumes:
  pgdata:
